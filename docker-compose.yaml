version: "3.9"
services:
  finchdoc:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    hostname: finchdoc
    container_name: finchdoc
    image: uproid/finch:latest
    volumes:
      - ./bin:/www/bin
      - ./pubspac.yml:/www/pubspac.yaml
      - ./lib:/www/lib
      - ./content:/www/content
      - ./public:/www/public
    restart: always
    ports:
      - "9902:9902"
      - "9901:9901"

  nginx_finchdoc:
    hostname: nginx_finchdoc
    container_name: nginx_finchdoc
    image: nginx:latest
    restart: always
    ports:
      - "9900:9900"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./public/:/var/www/html
    depends_on:
      - finchdoc
  
  nodejs:
      image: node:20-alpine
      working_dir: /app
      tty: true
      stdin_open: true
      volumes:
        - ./:/app
      command: sh -c "npm install && npm run watch:css"
      restart: always